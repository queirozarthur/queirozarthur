name: atividade

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 3h da manhã no horário de Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar atividade.svg
        run: python3 scripts/atividade.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: queirozarthur

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atividade.svg
          git diff --staged --quiet || git commit -m "atualiza atividade.svg"
          git push
